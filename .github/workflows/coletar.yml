name: Coletar motos

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h da manhã (horário de Brasília)
  workflow_dispatch:       # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: write          # para o robô salvar o lotes.json no repositório

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Rodar o coletor
        run: python coletor.py

      - name: Salvar resultados no repositório
        run: |
          git config user.name "robo-moto-leilao"
          git config user.email "robo@users.noreply.github.com"
          git add lotes.json || true
          git add copart_debug.json || true
          git diff --staged --quiet || git commit -m "Atualiza lotes"
          git push
